<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Job Search - HireHub</title>
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link th:rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}"/>
</head>

<body class="bg-light">
<!-- Navbar -->
<header class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" th:href="@{/}">
            <i class="fa-solid fa-briefcase text-primary fs-3"></i>
            <span>Hire<span class="logo_com">Hub</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarToggler">
            <ul class="navbar-nav m-auto my-2 my-lg-0">
                <li class="nav-item active">
                    <a class="nav-link" th:href="@{/global-search/}"><i class="fa-solid fa-magnifying-glass me-1"></i> Global Search</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2" sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm px-3 fw-semibold">Sign In</a>
                <a th:href="@{/register}" class="btn btn-primary btn-sm px-3 fw-semibold">Register</a>
            </div>

            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <a th:href="@{/dashboard/}" class="btn btn-outline-light btn-sm px-3 fw-semibold"><i class="fa-solid fa-gauge me-1"></i> Dashboard</a>
                <a th:href="@{/logout}" class="myBtn-light text-decoration-none">Logout</a>
            </div>
        </div>
    </div>
</header>

<section class="section">
    <!-- Sidebar Filters -->
    <div class="sidenav">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <label class="color-dull mb-0"><i class="fa-solid fa-filter me-1"></i> Filter Jobs</label>
            <a th:href="@{/global-search/}" class="text-xs text-primary-light text-decoration-none fw-semibold small">Reset</a>
        </div>
        <hr class="border-secondary opacity-25 my-2"/>

        <form id="myForm" th:action="@{/global-search/}" method="get">
            <!-- Employment Type -->
            <div class="form-group">
                <label class="color-dull">Employment Type</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:checked="${partTime}" id="part-time" name="partTime" th:value="Part-Time"/>
                    <label class="form-check-label" for="part-time">Part-Time</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="full-time" th:checked="${fullTime}" name="fullTime" th:value="Full-Time"/>
                    <label class="form-check-label" for="full-time">Full-Time</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="freelance" th:checked="${freelance}" name="freelance" th:value="Freelance"/>
                    <label class="form-check-label" for="freelance">Freelance</label>
                </div>
            </div>

            <!-- Remote Mode -->
            <div class="form-group mt-4">
                <label class="color-dull">Work Mode</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remote-only" th:value="Remote-Only" name="remoteOnly" th:checked="${remoteOnly}"/>
                    <label class="form-check-label" for="remote-only">Remote Only</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="Office-Only" th:value="Office-Only" name="officeOnly" th:checked="${officeOnly}"/>
                    <label class="form-check-label" for="Office-Only">Office Only</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="partial-remote" th:value="Partial-Remote" name="partialRemote" th:checked="${partialRemote}"/>
                    <label class="form-check-label" for="partial-remote">Hybrid / Partial</label>
                </div>
            </div>

            <!-- Date Range -->
            <div class="form-group mt-4">
                <label class="color-dull">Date Posted</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="today" name="today" th:checked="${today}"/>
                    <label class="form-check-label" for="today">Today</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="7days" name="days7" th:checked="${days7}"/>
                    <label class="form-check-label" for="7days">Last 7 Days</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="30days" name="days30" th:checked="${days30}"/>
                    <label class="form-check-label" for="30days">Last 30 Days</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-sm w-100 mt-4 fw-bold shadow-sm">
                <i class="fa-solid fa-check me-1"></i> Apply Filters
            </button>

            <input id="hidJob" name="job" th:value="${job}" hidden/>
            <input id="hidLoc" name="location" th:value="${location}" hidden/>
        </form>
    </div>

    <!-- Main Search Area -->
    <article class="p-4">
        <div class="box mb-4">
            <h1 class="primary-title mb-3">Explore All Open Positions</h1>
            <div class="inner">
                <input id="job" class="form-control" type="text" placeholder="Job title, keywords, or skills..." name="job" th:value="${job}"/>
                <input id="loc" class="form-control" type="text" placeholder="Location, city, or state..." name="location" th:value="${location}"/>
                <button class="btn btn-primary" type="submit" form="myForm"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>

        <div class="box">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <label class="large-label mb-0">Search Results</label>
            </div>

            <!-- Empty Search Results -->
            <div th:if="${#lists.isEmpty(jobPost)}" class="text-center py-5">
                <div class="stat-icon bg-light text-muted mx-auto mb-3" style="width:64px; height:64px; font-size:1.8rem;">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <h4 class="fw-bold text-dark fs-5 mb-1">No Matching Jobs Found</h4>
                <p class="text-muted small mb-3">Try adjusting your keywords or clearing selected filters.</p>
                <a th:href="@{/global-search/}" class="btn btn-outline-primary btn-sm px-4 fw-semibold">Reset Search Filters</a>
            </div>

            <!-- Job Cards Grid -->
            <div th:unless="${#lists.isEmpty(jobPost)}">
                <th:block th:each="jobPost:${jobPost}">
                    <div class="job-row">
                        <div class="row align-items-center g-3">
                            <div class="col-md-5">
                                <a th:href="@{/job-details-apply/{id}(id=${jobPost.jobPostId})}" class="text-decoration-none">
                                    <h5 class="job-title mb-1 d-inline-flex align-items-center flex-wrap gap-1">
                                        [[${jobPost.jobTitle}]]
                                        <span class="title-span bg-primary-subtle text-primary" sec:authorize="hasAuthority('Recruiter')"
                                              th:text="'(' + ${jobPost.totalCandidates} + ' Applied)'">(0 Applied)</span>
                                        <span class="badge badge-remote" sec:authorize="hasAuthority('Job Seeker')"
                                              th:if="${jobPost.isActive == true}"><i class="fa-solid fa-check me-1"></i>Applied</span>
                                        <span class="badge badge-type" sec:authorize="hasAuthority('Job Seeker')"
                                              th:if="${jobPost.isSaved == true}"><i class="fa-solid fa-bookmark me-1"></i>Saved</span>
                                    </h5>
                                </a>
                            </div>
                            <div class="col-md-3 text-start text-md-center">
                                <span class="text-muted small fw-medium">
                                    <i class="fa-solid fa-location-dot text-danger me-1"></i>
                                    <span th:text="${jobPost.jobLocationId != null ? (jobPost.jobLocationId.city + ', ' + jobPost.jobLocationId.state) : 'Not specified'}">City State</span>
                                </span>
                            </div>
                            <div class="col-md-4 text-start text-md-end">
                                <span class="badge bg-light text-dark border px-3 py-2 fw-semibold">
                                    <i class="fa-solid fa-building text-primary me-1"></i>
                                    <span th:text="${jobPost.jobCompanyId != null ? jobPost.jobCompanyId.name : 'Company'}">Company Name</span>
                                </span>
                                <a th:href="@{/job-details-apply/{id}(id=${jobPost.jobPostId})}" class="btn btn-sm btn-outline-primary ms-2 px-3 fw-semibold">
                                    Details <i class="fa-solid fa-arrow-right ms-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </th:block>
            </div>
        </div>
    </article>
</section>

<script type="text/javascript" th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script type="text/javascript" th:src="@{/js/main.js}"></script>
<script>
    $('#job, #loc').on('input change keyup', function() {
      $('#hidJob').val($('#job').val());
      $('#hidLoc').val($('#loc').val());
    });
    $('#myForm').on('submit', function() {
      $('#hidJob').val($('#job').val());
      $('#hidLoc').val($('#loc').val());
    });
</script>
</body>
</html>
