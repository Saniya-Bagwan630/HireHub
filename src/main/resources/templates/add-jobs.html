<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Post / Edit Job - HireHub</title>
    <link th:rel="stylesheet" type="text/css" th:href="@{/summernote/summernote-lite.min.css}"/>
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link th:rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}"/>
</head>

<body class="bg-light">
<!-- Navbar -->
<header class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" th:href="@{/dashboard/}">
            <i class="fa-solid fa-briefcase text-primary fs-3"></i>
            <span>Hire<span class="logo_com">Hub</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarToggler">
            <ul class="navbar-nav m-auto my-2 my-lg-0">
                <li class="nav-item active" sec:authorize="hasAuthority('Recruiter')">
                    <a class="nav-link" th:href="@{/dashboard/add}"><i class="fa-solid fa-plus-circle me-1"></i> Post Job</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('Recruiter')">
                    <a class="nav-link" th:href="@{/dashboard/}"><i class="fa-solid fa-list-check me-1"></i> Manage Jobs</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('Recruiter')">
                    <a class="nav-link" th:href="@{/recruiter-profile/}"><i class="fa-solid fa-building me-1"></i> Account</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/logout}" class="myBtn-light text-decoration-none">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                </a>
            </div>
        </div>
    </div>
</header>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4 bg-white">
                <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                    <div>
                        <h2 class="fw-bold fs-3 text-dark mb-1">
                            <i class="fa-solid fa-pen-to-square text-primary me-2"></i>
                            <span th:text="${jobPostActivity.jobPostId != null ? 'Edit Job Posting' : 'Post a New Job'}">Post New Job</span>
                        </h2>
                        <p class="text-muted small mb-0">Fill in the details below to publish your job opportunity to candidates</p>
                    </div>
                    <a th:href="@{/dashboard/}" class="btn btn-outline-secondary btn-sm px-3 fw-semibold">Cancel</a>
                </div>

                <form id="job-main-form" th:action="@{/dashboard/addNew}" th:object="${jobPostActivity}" method="post">
                    <input hidden type="text" th:field="*{jobPostId}"/>
                    <input hidden type="text" th:field="*{jobLocationId.Id}"/>
                    <input hidden type="text" th:field="*{jobCompanyId.Id}"/>

                    <!-- Job Details -->
                    <div class="mb-4">
                        <label class="font_sub_heading_color mb-2">Job Details</label>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-dark">Job Title *</label>
                            <input id="title" type="text" th:field="*{jobTitle}" class="form-control" placeholder="e.g. Senior Software Engineer" required/>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-dark">Employment Type *</label>
                                <select id="type" th:field="*{jobType}" class="form-select" required>
                                    <option value="">Select Type</option>
                                    <option th:value="Full-time">Full-time</option>
                                    <option th:value="Part-time">Part-time</option>
                                    <option th:value="Freelance">Freelance</option>
                                    <option th:value="Internship">Internship</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-dark">Work Mode *</label>
                                <select id="remote" th:field="*{remote}" class="form-select" required>
                                    <option value="">Select Remote Mode</option>
                                    <option th:value="Remote-Only">Remote-Only</option>
                                    <option th:value="Office-Only">Office-Only</option>
                                    <option th:value="Partial-Remote">Partial-Remote</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-dark">Salary Offer</label>
                                <input id="salary" th:field="*{salary}" type="text" class="form-control" placeholder="e.g. $90,000 - $120,000"/>
                            </div>
                        </div>
                    </div>

                    <!-- Job Description -->
                    <div class="mb-4">
                        <label class="font_sub_heading_color mb-2">Job Description *</label>
                        <textarea rows="6" id="content" placeholder="Detailed responsibilities, qualifications, and benefits..."
                                  class="form-control" th:field="*{descriptionOfJob}" autocomplete="off" required></textarea>
                    </div>

                    <!-- Company & Location -->
                    <div class="mb-4">
                        <label class="font_sub_heading_color mb-2">Company & Location</label>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-dark">Company Name *</label>
                            <input id="companyName" th:field="*{jobCompanyId.name}" type="text" class="form-control" placeholder="Company Name" required/>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-dark">City</label>
                                <input th:field="*{jobLocationId.city}" id="city" type="text" class="form-control" placeholder="City"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-dark">State</label>
                                <input id="state" th:field="*{jobLocationId.state}" type="text" class="form-control" placeholder="State"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-dark">Country</label>
                                <input id="country" th:field="*{jobLocationId.country}" type="text" class="form-control" placeholder="Country"/>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                        <a th:href="@{/dashboard/}" class="btn btn-light border px-4 fw-semibold">Cancel</a>
                        <button type="submit" name="submit" class="btn btn-primary px-5 py-2.5 fw-bold shadow-sm">
                            <i class="fa-solid fa-floppy-disk me-2"></i> Save Job Posting
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script type="text/javascript" th:src="@{/summernote/summernote-lite.min.js}"></script>
<script type="text/javascript" th:src="@{/js/main.js}"></script>
<script>
    $(document).ready(function() {
        $('#content').summernote({
            height: 180,
            placeholder: 'Write the job responsibilities, skills, and qualifications here...'
        });
    });
</script>
</body>
</html>
