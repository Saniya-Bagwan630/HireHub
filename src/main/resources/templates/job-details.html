<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org/" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" style="height: 100%">
<head>
    <meta charset="UTF-8"/>
    <title>Candidate Dashboard</title>
    <meta charset="utf-8"/>
    <meta http-equiv="x-ua-compatible" content="ie=edge"/>
    <meta name="description" content=""/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>


    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/styles.css}"/>
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css} "/>
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/font-awesome.min.css}"/>
    <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>

<body th:object="${jobDetails}" style="font-family: 'Montserrat';height: 100%">

<header class="navbar navbar-expand-lg navbar-dark">
    <label class="mt-2 ms-5 font-weight-bold h5"
    ><a th:href="@{/dashboard/}">hotdevjobs</a
    ><span class="logo_com font-weight-bold h5" style="color: white">
          .com</span
    ></label
    >
    <button
            class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#navbarTogglerDemo02"
            aria-controls="navbarTogglerDemo02"
            aria-expanded="false"
            aria-label="Toggle navigation"
    >
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarToggler">
        <ul class="navbar-nav m-auto mt-2 mt-lg-0">

            <li class="nav-item active">
                <a sec:authorize="hasAuthority('Job Seeker')" class="nav-link" th:href="@{/dashboard/}"
                ><i class="fas fa-search"></i>Search for Jobs</a
                >
            </li>
            <li class="nav-item ">
                <a sec:authorize="hasAuthority('Job Seeker')" class="nav-link" th:href="@{/saved-jobs/}">
                    <i class="fa-solid fa-eye"></i>View Saved Jobs</a>
            </li>
            <li class="nav-item ">
                <a sec:authorize="hasAuthority('Job Seeker')" class="nav-link" th:href="@{/job-seeker-profile/}">
                    <i class="fa-solid fa-pencil"></i>Edit Profile</a>
            </li>

            <li class="nav-item ">
                <a sec:authorize="hasAuthority('Recruiter')" class="nav-link" th:href="@{/dashboard/add}"
                ><i class="fa-solid fa-file-circle-plus"></i>Post New Job</a
                >
            </li>
            <li class="nav-item active">
                <a sec:authorize="hasAuthority('Recruiter')" class="nav-link" th:href="@{/dashboard/}"
                > <i class="fa-solid fa-eye"></i>View Your Jobs</a
                >
            </li>
            <li class="nav-item ">
                <a sec:authorize="hasAuthority('Recruiter')" class="nav-link" th:href="@{/recruiter-profile/}"
                > <i class="fa-solid fa-pencil"></i>Edit Account</a
                >
            </li>

        </ul>
        <img
                class="rounded-circle me-3"
                height="50px"
                width="50x"
                th:src="@{${user.photosImagePath}}"
        />
        <label th:text="${user.firstName+' '+user.lastName}" class="nav-item nav-link px-2 me-3">John Doe</label>

        <button class="myBtn-light me-5" onclick="window.location.href='/logout'">Logout</button>
    </div>
</header>


<!-- header-end -->
<section class="section">
    <!--    Side Bar Starts here    -->
    <div class="sidenav px-5">
        <div>
            <hr/>
        </div>
    </div>
    <article>
        <div class="box px-3">
            <a class="mt-3 ms-3 primary" id="back-link"><i class="fa-solid fa-angle-left me-1"></i> Back to Search
                Results </a>
            <h1 class="primary-title mt-3"> Job Details </h1>
            <div class="ms-3">
                <h4 th:text="${jobDetails.jobTitle}" class="job-title text-left">Software Engineer</h4>
                <div class="mt-1">
                    <p th:text="${jobDetails.jobLocationId.city+', '+ jobDetails.jobLocationId.state}"
                       class="m-0"> California, USA</p>
                    <p th:text="${jobDetails.jobCompanyId.name}">Company</p>
                </div>
            </div>
        </div>

        <div class="box mt-3">
            <label class="large-label px-3 mt-3"> Job Specs </label>

            <div class="job-row">
                <div class="row ">
                    <div class="col-md-3">
                        <label class="text-left">Date Posted:<span
                                th:text="${jobDetails.postedDate}">12 Nov, 2030</span></label>
                    </div>
                    <div class="col-md-3 text-center">
                        <label> Salary: <span th:text="${jobDetails.salary}">50k - 120k/y</span></label>
                    </div>
                    <div class="col-md-3 text-center">
                        <label>Type: <span th:text="${jobDetails.jobType}"> Full-time</span></label>
                    </div>
                    <div class="col-md-3 text-right">
                        <label>Remote: <span th:text="${jobDetails.remote}">Remote</span></label>
                    </div>
                </div>
            </div>

            <div class="px-3 mb-3" sec:authorize="hasAuthority('Job Seeker')">
                <label class="large-label "> Job Description </label>
                <div th:utext="${jobDetails.descriptionOfJob}"></div>
            </div>



            <div class="px-3 mb-3" sec:authorize="hasAuthority('Recruiter')">
                <div class="row">
                    <div class="col-md-8">
                        <label class="large-label "> Job Description </label>
                        <div th:utext="${jobDetails.descriptionOfJob}"></div>
                    </div>
                    <div class="col-md-4">
                        <div class="candidatesApplied">
                            <label class="font-weight-bold mb-2">Candidates Applied for Job</label>
                            <th:block th:each="applyList:${applyList}">
                                <div class="mb-2 p-2 rounded" style="background-color: #f8f9fa; border: 1px solid #dee2e6;">
                                    <div>
                                        <a th:href="@{/job-seeker-profile/{id}(id=${applyList.userId.userAccountId})}"
                                           class="fw-bold text-dark text-decoration-none"
                                           th:text="${applyList.userId.firstName+' '+applyList.userId.lastName}">FirstName,
                                            LastName</a>
                                    </div>
                                    <div class="mt-1" th:if="${applyList.resume != null && !applyList.resume.isBlank()}">
                                        <a class="btn btn-sm btn-outline-danger py-0 px-2"
                                           th:href="@{|/job-seeker-profile/downloadResume?fileName=${applyList.resume}&userID=${applyList.userId.userAccountId}|}">
                                            <i class="fa-solid fa-file-arrow-down me-1"></i> Download Resume
                                        </a>
                                    </div>
                                </div>
                            </th:block>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-3 px-3" sec:authorize="hasAuthority('Job Seeker')">
                <div class="row">
                    <div class="col-md-3">
                        <button class="btn-sec btn-red w-100" type="button" data-bs-toggle="modal" data-bs-target="#applyModal" th:if="${alreadyApplied == false}">
                            Apply Now
                        </button>
                        <button class="btn-sec btn-red w-100" disabled th:if="${alreadyApplied == true}">
                            Already Applied
                        </button>
                    </div>
                    <div class="col-md-3">
                        <form th:action="@{/job-details/save/{id}(id=${jobDetails.jobPostId})}" th:object="${applyJob}"
                              method="post">
                            <button class="btn-sec btn-black w-100" type="submit" th:if="${alreadySaved == false}">Save
                                Job
                            </button>
                            <button class="btn-sec btn-black w-100" disabled th:if="${alreadySaved == true}">Already
                                Saved
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Apply Modal -->
                <div class="modal fade" id="applyModal" tabindex="-1" aria-labelledby="applyModalLabel" aria-hidden="true" th:if="${alreadyApplied == false}">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title font-weight-bold" id="applyModalLabel">Apply for [[${jobDetails.jobTitle}]]</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <form th:action="@{/job-details/apply/{id}(id=${jobDetails.jobPostId})}" method="post" enctype="multipart/form-data">
                                <div class="modal-body text-start">
                                    <label class="font-weight-bold mb-2">Resume Selection Options:</label>

                                    <div class="form-check mb-2" th:if="${user != null && user.resume != null && !user.resume.isBlank()}">
                                        <input class="form-check-input" type="radio" name="resumeOption" id="optionExisting" value="existing" checked onclick="toggleResumeInput(false)">
                                        <label class="form-check-label" for="optionExisting">
                                            <strong>Continue with Existing Resume:</strong> <span th:text="${user.resume}">resume.pdf</span>
                                        </label>
                                    </div>

                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="radio" name="resumeOption" id="optionUpload" value="upload"
                                               th:checked="${user == null || user.resume == null || user.resume.isBlank()}"
                                               onclick="toggleResumeInput(true)">
                                        <label class="form-check-label" for="optionUpload">
                                            <strong>Upload New Resume</strong> (PDF, DOC, DOCX - max 10MB)
                                        </label>
                                    </div>

                                    <div id="newResumeSection" class="mt-3" th:style="${user != null && user.resume != null && !user.resume.isBlank()} ? 'display: none;' : 'display: block;'">
                                        <label for="resumeFile" class="form-label font-weight-bold">Select Resume File</label>
                                        <input class="form-control" type="file" id="resumeFile" name="resumeFile" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" th:required="${user == null || user.resume == null || user.resume.isBlank()}">
                                    </div>

                                    <div class="mt-3">
                                        <label for="coverLetter" class="form-label font-weight-bold">Cover Letter / Note (Optional)</label>
                                        <textarea class="form-control" id="coverLetter" name="coverLetter" rows="3" placeholder="Add a short note or cover letter..."></textarea>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                    <button type="submit" class="btn btn-danger">Confirm & Submit Application</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-3 px-3" sec:authorize="hasAuthority('Recruiter')">
                <div class="row">
                    <div class="col-md-3">
                        <form th:action="@{/dashboard/edit/{id}(id=${jobDetails.jobPostId})}" method="post">
                            <button class="btn-sec btn-red w-100" type="submit">Edit Job</button>
                        </form>
                    </div>
                    <div class="col-md-3">
                        <form th:action="@{/dashboard/deleteJob/{id}(id=${jobDetails.jobPostId})}" method="post">
                            <button class="btn-sec btn-black w-100" type="submit">Delete Job</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </article>
</section>


<script type="text/javascript" th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
<script type="text/javascript" th:src="@{/js/main.js}"></script>
<script>
    var element = document.getElementById('back-link');
    if (element) {
        element.setAttribute('href', document.referrer);
        element.onclick = function() {
          history.back();
          return false;
        }
    }

    function toggleResumeInput(showUpload) {
        if (showUpload) {
            $('#newResumeSection').show();
            $('#resumeFile').prop('required', true);
        } else {
            $('#newResumeSection').hide();
            $('#resumeFile').prop('required', false);
        }
    }
</script>
</body>
</html>
